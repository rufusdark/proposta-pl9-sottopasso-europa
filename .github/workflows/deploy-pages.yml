name: Deploy to GitHub Pages

on:
  push:
    branches: [master]

  # Permette anche esecuzione manuale da GitHub
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build site from Documenti/Martina Franca
        run: |
          mkdir -p _site
          cp -r "Documenti/Martina Franca/"* _site/
          echo "File copiati in _site/:"
          ls -la _site/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
