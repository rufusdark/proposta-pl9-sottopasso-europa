<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <title>Barocco Cosmico — Martina Franca</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #050d1a;
    }
    svg {
      display: block;
      max-width: 100vw;
      max-height: 100vh;
    }
  </style>
</head>
<body>
<svg xmlns="http://www.w3.org/2000/svg"
     viewBox="0 0 1000 1000"
     width="1000" height="1000"
     role="img"
     aria-label="Barocco Cosmico — variante Martina Franca">

  <defs>
    <!-- Radial gradient per la cupola-galassia -->
    <radialGradient id="domeGlow" cx="50%" cy="55%" r="50%" fx="45%" fy="50%">
      <stop offset="0%"   stop-color="#8b3fd4"/>
      <stop offset="40%"  stop-color="#6b21a8"/>
      <stop offset="75%"  stop-color="#4a0e78"/>
      <stop offset="100%" stop-color="#0a1628" stop-opacity="0"/>
    </radialGradient>

    <!-- Bagliore interno cupola -->
    <radialGradient id="coreGlow" cx="50%" cy="50%" r="40%">
      <stop offset="0%"   stop-color="#a855f7" stop-opacity="0.6"/>
      <stop offset="50%"  stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#6b21a8" stop-opacity="0"/>
    </radialGradient>

    <!-- Filtro glow per orbite e stelle -->
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <!-- Stella singola -->
    <g id="star">
      <circle r="1.5" fill="#ffffff" opacity="0.9"/>
    </g>

    <!-- Stella piccola -->
    <g id="starSm">
      <circle r="0.8" fill="#ffffff" opacity="0.5"/>
    </g>

    <!-- Stella brillante a 4 punte -->
    <g id="starBright">
      <circle r="2" fill="#ffffff" opacity="1"/>
      <ellipse rx="4" ry="1" cx="0" cy="0" fill="#ffffff" opacity="0.3"/>
      <ellipse rx="1" ry="4" cx="0" cy="0" fill="#ffffff" opacity="0.3"/>
    </g>

    <!-- Putto-astronave: silhouette geometrica minimal -->
    <!-- Testa circolare + ali ad arco + corpo essenziale -->
    <g id="putto">
      <!-- alone/glow -->
      <circle cx="0" cy="0" r="28" fill="#d4a843" opacity="0.08" filter="url(#softGlow)"/>
      <!-- ali ad arco (sinistra) -->
      <path d="M-7,-6 Q-28,-26 -18,-34 Q-8,-40 -4,-18 Z"
            fill="#d4a843" opacity="0.8"/>
      <!-- ali ad arco (destra) -->
      <path d="M7,-6 Q28,-26 18,-34 Q8,-40 4,-18 Z"
            fill="#d4a843" opacity="0.8"/>
      <!-- testa -->
      <circle cx="0" cy="-8" r="8" fill="#ffffff" opacity="0.95"/>
      <!-- corpo/astronave -->
      <path d="M-6,-2 L6,-2 L8,6 L-8,6 Z"
            fill="#d4a843" opacity="0.85"/>
      <!-- scia luminosa -->
      <ellipse cx="0" cy="14" rx="3" ry="6" fill="#d4a843" opacity="0.25" filter="url(#glow)"/>
    </g>

    <!-- Putto-astronave variante 2: posizione diversa -->
    <g id="putto2">
      <circle cx="0" cy="0" r="24" fill="#6b21a8" opacity="0.08" filter="url(#softGlow)"/>
      <path d="M-6,-5 Q-24,-22 -15,-29 Q-6,-34 -3,-15 Z"
            fill="#d4a843" opacity="0.7"/>
      <path d="M6,-5 Q24,-22 15,-29 Q6,-34 3,-15 Z"
            fill="#d4a843" opacity="0.7"/>
      <circle cx="0" cy="-7" r="7" fill="#ffffff" opacity="0.95"/>
      <path d="M-5,-1 L5,-1 L7,5 L-7,5 Z"
            fill="#d4a843" opacity="0.8"/>
      <ellipse cx="0" cy="12" rx="2.5" ry="5" fill="#d4a843" opacity="0.2" filter="url(#glow)"/>
    </g>
  </defs>

  <!-- Sfondo navy -->
  <rect x="0" y="0" width="1000" height="1000" fill="#0a1628"/>

  <!-- ==================== -->
  <!-- CAMPO STELLARE (25 stelle) -->
  <!-- ==================== -->

  <!-- Stelle sparse - layer profondo (piccole, più opache) -->
  <use href="#starSm" x="80"  y="120"/>
  <use href="#starSm" x="210" y="70"/>
  <use href="#starSm" x="340" y="150"/>
  <use href="#starSm" x="650" y="90"/>
  <use href="#starSm" x="780" y="180"/>
  <use href="#starSm" x="900" y="80"/>
  <use href="#starSm" x="150" y="350"/>
  <use href="#starSm" x="850" y="320"/>
  <use href="#starSm" x="920" y="450"/>
  <use href="#starSm" x="60"  y="600"/>
  <use href="#starSm" x="180" y="750"/>
  <use href="#starSm" x="870" y="700"/>
  <use href="#starSm" x="940" y="820"/>
  <use href="#starSm" x="110" y="880"/>
  <use href="#starSm" x="750" y="870"/>

  <!-- Stelle medie -->
  <use href="#star" x="130" y="190"/>
  <use href="#star" x="400" y="80"/>
  <use href="#star" x="720" y="130"/>
  <use href="#star" x="880" y="250"/>
  <use href="#star" x="100" y="480"/>
  <use href="#star" x="820" y="550"/>
  <use href="#star" x="250" y="820"/>
  <use href="#star" x="680" y="780"/>

  <!-- Stelle brillanti -->
  <use href="#starBright" x="280" y="100"/>
  <use href="#starBright" x="750" y="200"/>
  <use href="#starBright" x="120" y="720"/>
  <use href="#starBright" x="850" y="650"/>

  <!-- ==================== -->
  <!-- ORBITE ELLITTICHE ORO -->
  <!-- ==================== -->

  <!-- Orbita esterna 1 -->
  <ellipse cx="500" cy="520" rx="380" ry="140"
           fill="none" stroke="#d4a843" stroke-width="0.8"
           opacity="0.25" transform="rotate(-15 500 520)" filter="url(#glow)"/>

  <!-- Orbita esterna 2 -->
  <ellipse cx="500" cy="510" rx="320" ry="120"
           fill="none" stroke="#d4a843" stroke-width="0.6"
           opacity="0.35" transform="rotate(12 500 510)" filter="url(#glow)"/>

  <!-- Orbita media 1 -->
  <ellipse cx="500" cy="500" rx="260" ry="90"
           fill="none" stroke="#d4a843" stroke-width="1"
           opacity="0.45" transform="rotate(-8 500 500)" filter="url(#glow)"/>

  <!-- Orbita media 2 -->
  <ellipse cx="500" cy="490" rx="200" ry="70"
           fill="none" stroke="#d4a843" stroke-width="0.8"
           opacity="0.55" transform="rotate(20 500 490)" filter="url(#glow)"/>

  <!-- Orbita interna -->
  <ellipse cx="500" cy="480" rx="140" ry="50"
           fill="none" stroke="#d4a843" stroke-width="1.2"
           opacity="0.65" transform="rotate(-5 500 480)" filter="url(#glow)"/>

  <!-- ==================== -->
  <!-- CUPOLA-GALASSIA CENTRALE -->
  <!-- ==================== -->

  <!-- Bagliore esterno -->
  <circle cx="500" cy="500" r="220" fill="url(#domeGlow)" opacity="0.5"/>

  <!-- Corpo cupola (arco a tutto sesto) -->
  <path d="M340,500
           C340,380 370,320 420,270
           C460,230 500,210 500,210
           C500,210 540,230 580,270
           C630,320 660,380 660,500 Z"
        fill="url(#domeGlow)" opacity="0.9"/>

  <!-- Base cupola (rettangolo inferiore) -->
  <rect x="340" y="470" width="320" height="80"
        rx="4" ry="4"
        fill="#4a0e78" opacity="0.8"/>

  <!-- Fregio base cupola - motivo a arcate -->
  <g opacity="0.5">
    <path d="M350,500 L350,520 L370,520 L370,500 Z" fill="#d4a843" opacity="0.4"/>
    <path d="M380,500 L380,520 L400,520 L400,500 Z" fill="#d4a843" opacity="0.4"/>
    <path d="M410,500 L410,520 L430,520 L430,500 Z" fill="#d4a843" opacity="0.4"/>
    <path d="M440,500 L440,520 L460,520 L460,500 Z" fill="#d4a843" opacity="0.4"/>
    <path d="M470,500 L470,520 L490,520 L490,500 Z" fill="#d4a843" opacity="0.4"/>
    <path d="M500,500 L500,520 L520,520 L520,500 Z" fill="#d4a843" opacity="0.4"/>
    <path d="M530,500 L530,520 L550,520 L550,500 Z" fill="#d4a843" opacity="0.4"/>
    <path d="M560,500 L560,520 L580,520 L580,500 Z" fill="#d4a843" opacity="0.4"/>
    <path d="M590,500 L590,520 L610,520 L610,500 Z" fill="#d4a843" opacity="0.4"/>
    <path d="M620,500 L620,520 L640,520 L640,500 Z" fill="#d4a843" opacity="0.4"/>
  </g>

  <!-- Spiral galaxy all'interno della cupola -->
  <g opacity="0.6" filter="url(#softGlow)">
    <!-- spirale principale -->
    <path d="M500,400
             C530,390 550,410 540,440
             C525,480 475,485 460,450
             C445,415 485,385 510,395"
          fill="none" stroke="#a855f7" stroke-width="2.5" opacity="0.7"/>
    <path d="M500,405
             C520,395 535,415 530,435
             C520,465 485,470 475,445
             C465,420 490,400 505,405"
          fill="none" stroke="#c084fc" stroke-width="1.5" opacity="0.5"/>

    <!-- spirale secondaria -->
    <path d="M500,380
             C545,365 575,400 560,445
             C540,505 450,510 430,460
             C410,410 465,365 500,380"
          fill="none" stroke="#7c3aed" stroke-width="1.5" opacity="0.4"/>

    <!-- punti luminosi nella spirale -->
    <circle cx="510" cy="395" r="1.5" fill="#a855f7" opacity="0.8"/>
    <circle cx="525" cy="415" r="1" fill="#c084fc" opacity="0.7"/>
    <circle cx="520" cy="445" r="1.2" fill="#a855f7" opacity="0.6"/>
    <circle cx="485" cy="460" r="1" fill="#c084fc" opacity="0.5"/>
    <circle cx="470" cy="440" r="0.8" fill="#a855f7" opacity="0.5"/>
  </g>

  <!-- Nube stellare al centro cupola -->
  <g opacity="0.4">
    <circle cx="500" cy="420" r="3" fill="#ffffff" opacity="0.9"/>
    <circle cx="515" cy="410" r="1.5" fill="#ffffff" opacity="0.6"/>
    <circle cx="485" cy="430" r="1" fill="#ffffff" opacity="0.5"/>
    <circle cx="505" cy="440" r="1.5" fill="#ffffff" opacity="0.7"/>
    <circle cx="490" cy="405" r="1" fill="#ffffff" opacity="0.5"/>
    <circle cx="520" cy="430" r="1.2" fill="#ffffff" opacity="0.6"/>
  </g>

  <!-- ==================== -->
  <!-- RAGGI DI LUCE DALL'ALTO -->
  <!-- ==================== -->

  <g opacity="0.06">
    <polygon points="500,180 420,500 440,500" fill="#d4a843"/>
    <polygon points="500,180 540,500 560,500" fill="#d4a843"/>
    <polygon points="500,180 480,500 490,500" fill="#d4a843"/>
    <polygon points="500,180 510,500 520,500" fill="#d4a843"/>
  </g>

  <!-- ==================== -->
  <!-- PUTTI-ASTRONAVI -->
  <!-- ==================== -->

  <!-- Putto 1 - alto a sinistra -->
  <use href="#putto" x="320" y="300"
       transform="rotate(-25 320 300)"/>

  <!-- Putto 2 - alto a destra -->
  <use href="#putto" x="680" y="280"
       transform="rotate(20 680 280) scale(0.85)"/>

  <!-- Putto 3 - naviga lungo l'orbita -->
  <use href="#putto2" x="250" y="470"
       transform="rotate(-10 250 470) scale(0.75)"/>

  <!-- Putto 4 - orbita destra -->
  <use href="#putto2" x="760" y="440"
       transform="rotate(15 760 440) scale(0.7)"/>

  <!-- Putto 5 - in basso -->
  <use href="#putto" x="400" y="740"
       transform="rotate(-35 400 740) scale(0.65)"/>

  <!-- Putto 6 - in basso a destra -->
  <use href="#putto2" x="620" y="720"
       transform="rotate(30 620 720) scale(0.6)"/>

  <!-- ==================== -->
  <!-- DETTAGLI BAROCCHI (decorazioni minime) -->
  <!-- ==================== -->

  <!-- Volute laterali -->
  <g opacity="0.3" stroke="#d4a843" fill="none" stroke-width="1.2">
    <path d="M330,520 C300,500 280,530 290,550 C300,570 320,560 310,540"/>
    <path d="M670,520 C700,500 720,530 710,550 C700,570 680,560 690,540"/>
  </g>

  <!-- ==================== -->
  <!-- TESTO -->
  <!-- ==================== -->

  <g text-anchor="middle" font-family="Georgia, 'Times New Roman', serif">
    <text x="500" y="860"
          font-size="48" fill="#d4a843" opacity="0.9"
          letter-spacing="8">
      BAROCCO COSMICO
    </text>
    <text x="500" y="895"
          font-size="18" fill="#d4a843" opacity="0.5"
          letter-spacing="12" font-variant="small-caps">
      Martina Franca
    </text>
  </g>

</svg>
</body>
</html>
